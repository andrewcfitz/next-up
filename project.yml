name: NextUp
options:
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Dev.xcconfig
  Release: Config/Prod.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
schemes:
  NextUp:
    build:
      targets:
        NextUp: all
        NextUpTests: [test]
    test:
      targets:
        - NextUpTests
  NextUpiOS:
    build:
      targets:
        NextUpiOS: all
  NextUpWatch:
    build:
      targets:
        NextUpWatch: all
targets:
  NextUp:
    type: application
    platform: macOS
    sources:
      - NextUp
      - Shared
    dependencies:
      - target: NextUpWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: biz.fitz.NextUp
        DEVELOPMENT_TEAM: 8353VT99LA
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: NextUp/NextUp.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Next Up
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
  NextUpWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - NextUpWidget
      - WidgetShared
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: biz.fitz.NextUp.Widget
        DEVELOPMENT_TEAM: 8353VT99LA
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: NextUpWidget/NextUpWidget.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: NextUpWidget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Next Up
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  NextUpTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - NextUpTests
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: biz.fitz.NextUpTests
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: NO
  NextUpiOS:
    type: application
    platform: iOS
    sources:
      - NextUpiOS
      - Shared
    dependencies:
      - target: NextUpiOSWidgetExtension
      - target: NextUpWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NEXTUP_IOS_BUNDLE_ID)
        DEVELOPMENT_TEAM: 8353VT99LA
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: NextUpiOS/NextUpiOS.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(NEXTUP_DISPLAY_NAME)
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: match AppStore $(PRODUCT_BUNDLE_IDENTIFIER)
    info:
      path: NextUpiOS/Info.plist
      properties:
        NextUpAppGroup: $(NEXTUP_APP_GROUP)
        UILaunchScreen: {}
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - $(NEXTUP_IOS_BUNDLE_ID).refresh
        ITSAppUsesNonExemptEncryption: false
  NextUpiOSWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - NextUpiOSWidget
      - WidgetShared
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NEXTUP_IOS_BUNDLE_ID).Widget
        DEVELOPMENT_TEAM: 8353VT99LA
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: NextUpiOSWidget/NextUpiOSWidget.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(NEXTUP_DISPLAY_NAME)
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: match AppStore $(PRODUCT_BUNDLE_IDENTIFIER)
    info:
      path: NextUpiOSWidget/Info.plist
      properties:
        NextUpAppGroup: $(NEXTUP_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  NextUpWatch:
    type: application
    platform: watchOS
    sources:
      - NextUpWatch
      - Shared
    dependencies:
      - target: NextUpWatchWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NEXTUP_IOS_BUNDLE_ID).watchkitapp
        DEVELOPMENT_TEAM: 8353VT99LA
        CODE_SIGN_ENTITLEMENTS: NextUpWatch/NextUpWatch.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(NEXTUP_DISPLAY_NAME)
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: $(NEXTUP_IOS_BUNDLE_ID)
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: match AppStore $(PRODUCT_BUNDLE_IDENTIFIER)
    info:
      path: NextUpWatch/Info.plist
      properties:
        NextUpAppGroup: $(NEXTUP_APP_GROUP)
        WKApplication: true
  NextUpWatchWidgetExtension:
    type: app-extension
    platform: watchOS
    sources:
      - NextUpWatchWidget
      - WidgetShared
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NEXTUP_IOS_BUNDLE_ID).watchkitapp.Widget
        DEVELOPMENT_TEAM: 8353VT99LA
        CODE_SIGN_ENTITLEMENTS: NextUpWatchWidget/NextUpWatchWidget.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(NEXTUP_DISPLAY_NAME)
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: match AppStore $(PRODUCT_BUNDLE_IDENTIFIER)
    info:
      path: NextUpWatchWidget/Info.plist
      properties:
        NextUpAppGroup: $(NEXTUP_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
